name: Build APK

# Produces an installable APK for this branch on an x86_64 runner.
#
# Why GitHub Actions and not the device: the Android toolchain has no
# linux-aarch64 host binaries for either aapt2 (resource compilation) or the
# NDK (native cross-compilation), so the build cannot run on the phone.
#
# Release signing uses an explicitly declared signingConfig that reads
# MINIS_SIGNING_STORE_FILE (see app/build.gradle.kts). It must be the SAME key
# every run, otherwise build N+1 cannot install over build N and the only way
# forward is an uninstall — which deletes the user's data directory.
#
# ── Cost model ───────────────────────────────────────────────────────────────
# A cold run is ~12 min, dominated by three things that have nothing to do
# with the code being changed:
#   * Gradle assembleRelease  ~444 s  (mostly dependency download + R8)
#   * rclone/gomobile         ~171 s  (unchanged between Kotlin edits)
#   * native deps + rootfs    ~ 60 s  (unchanged between Kotlin edits)
# So everything that is a pure function of `deps/**` is cached under its own
# key, and everything that is a pure function of the build scripts is cached
# under a second key. A Kotlin/Compose-only change then hits both caches and
# re-runs only compile + dex + package.

on:
  workflow_dispatch:
  push:
    branches:
      - android-md-parse-tailcap
      - android-topbar-title-slot

permissions:
  contents: write

concurrency:
  # A newer push supersedes an in-flight build of the same branch: the old
  # APK is already stale and the cache it would save is the one we want, so
  # cancelling avoids queueing 12 minutes behind a superseded commit.
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with submodules (proot, ish)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # The runner image already ships an Android SDK and NDK. The old step
      # deleted them (`rm -rf $ANDROID_HOME/ndk`) to free disk, then paid
      # ~60 s of `rm` plus ~25 s of re-download to get cmake/NDK back. Keep
      # what is there; only drop the toolchains this build never touches.
      - name: Free disk space (minimal)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          missing=""
          [ -d "$ANDROID_HOME/platforms/android-36" ]      || missing="$missing platforms;android-36"
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ]        || missing="$missing build-tools;35.0.0"
          [ -d "$ANDROID_HOME/ndk/28.0.13004108" ]         || missing="$missing ndk;28.0.13004108"
          [ -d "$ANDROID_HOME/cmake/3.22.1" ]              || missing="$missing cmake;3.22.1"
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            # shellcheck disable=SC2086
            "$SDKMANAGER" --install $missing
          else
            echo "all required Android SDK packages are already present"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk"

      # Everything below is a pure function of `deps/**` and the rootfs
      # script. None of it changes when a Kotlin file does, so a hit here
      # removes ~171 s (gomobile/rclone) + ~60 s (proot/rootfs) per build.
      #
      # `src/android/app/libs/rclone.aar` is cached alongside its source
      # because the Gradle step consumes the copy, not `deps/build/...`.
      - name: Cache native prebuilts
        id: cache-native
        uses: actions/cache@v4
        with:
          path: |
            deps/build/rclone/rclone.aar
            src/android/app/libs/rclone.aar
            src/android/app/src/main/assets/alpine-minirootfs.tar
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/jniLibs
          key: native-v1-${{ hashFiles('deps/**', 'scripts/prepare_android_sandbox.sh') }}

      - name: Go toolchain
        if: steps.cache-native.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: deps/rclone-mobile/**/go.sum

      - name: Native deps — proot + loaders
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          bash deps/build_proot.sh
          ls -l src/android/app/src/main/assets/proot-aarch64 || true
          ls -l src/android/app/src/main/jniLibs/arm64-v8a/ || true

      - name: Native deps — Alpine rootfs asset
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          bash scripts/prepare_android_sandbox.sh
          ls -l src/android/app/src/main/assets/ | grep -iE 'alpine|rootfs' || true

      - name: Native deps — rclone via gomobile
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/
          ls -l src/android/app/libs/

      - name: Native prebuilts restored from cache
        if: steps.cache-native.outputs.cache-hit == 'true'
        run: |
          echo "cache hit: skipping proot / rootfs / gomobile (≈230 s saved)"
          ls -l src/android/app/libs/ || true
          ls -l src/android/app/src/main/jniLibs/arm64-v8a/ || true

      # The release variant is signed with MINIS_SIGNING_STORE_FILE. AGP
      # GENERATES a fresh keystore when it cannot find one, and it locates the
      # file through ANDROID_USER_HOME / ANDROID_SDK_HOME when either is set,
      # falling back to $HOME/.android — writing only to $HOME made an earlier
      # restore a no-op (three builds, three different digests). Write to every
      # candidate location and print the fingerprint so the log proves which
      # key was used instead of leaving it to inference.
      - name: Restore stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is missing; builds would not share a signing identity"
            exit 1
          fi
          for dir in \
              "$HOME/.android" \
              "${ANDROID_USER_HOME:-$HOME/.android}" \
              "${ANDROID_SDK_HOME:+$ANDROID_SDK_HOME/.android}" \
              "${ANDROID_SDK_ROOT:+$ANDROID_SDK_ROOT/.android}" \
              "${ANDROID_HOME:+$ANDROID_HOME/.android}" ; do
            [ -n "$dir" ] || continue
            mkdir -p "$dir"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$dir/debug.keystore"
            echo "wrote $dir/debug.keystore"
          done
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey \
            | keytool -printcert | grep SHA256
          echo "MINIS_SIGNING_STORE_FILE=$HOME/.android/debug.keystore" >> $GITHUB_ENV

      # ~/.gradle/caches is the dependency + transform cache; one key per
      # build-script hash means a Kotlin-only change restores it exactly and
      # never re-resolves a single artifact.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-v1-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-v1-${{ runner.os }}-

      # externalNativeBuild stages CMake under app/.cxx, NOT under ~/.gradle,
      # so the Gradle cache above does not cover pty_bridge / crash_handler /
      # jieba_jni. Ninja reuses the object files and only relinks when a
      # Kotlin-only change leaves the C++ inputs untouched.
      - name: Cache CMake NDK cxx
        uses: actions/cache@v4
        with:
          path: src/android/app/.cxx
          key: cxx-v1-${{ hashFiles('src/android/app/src/main/cpp/**', 'src/android/app/build.gradle.kts') }}
          restore-keys: |
            cxx-v1-

      - name: Gradle assembleRelease
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            --build-cache --parallel --no-daemon --stacktrace \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.vfs.watch=false \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find src/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; find src/android/app/build/outputs -maxdepth 3; exit 1; }
          echo "path=$APK" >> $GITHUB_OUTPUT
          cp "$APK" "Minis-1.15-hark.apk"
          ls -lh "Minis-1.15-hark.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "Minis-1.15-hark.apk" \
            | grep -E "^package:|sdkVersion|targetSdkVersion|application-label" || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: minis-apk
          path: Minis-1.15-hark.apk
          retention-days: 14

      - name: Attach to a Release (anonymous download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hark-build${{ github.run_number }}
          name: Minis 1.15 + hark (build ${{ github.run_number }})
          draft: false
          prerelease: true
          body: |
            Built from `${{ github.ref_name }}` at `${{ github.sha }}`.

            Android-only fork build. Installable over a previous build of this
            fork without uninstalling (the signing key is pinned), but separate
            from any other Minis distribution: `applicationId com.openminis.app`,
            own data directory.
          files: Minis-1.15-hark.apk
